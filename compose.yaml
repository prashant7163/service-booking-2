services:
  postgres:
    image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_DB: service_booking_two
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d service_booking_two"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build:
      context: backend
      target: development
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/service_booking_two
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDEMPTION_HMAC_SECRET: ${REDEMPTION_HMAC_SECRET:?Set REDEMPTION_HMAC_SECRET}
      BOOKING_SIMULATION_VERIFICATION_ENABLED: ${SIMULATED_VERIFICATION_ENABLED:-false}
      BOOKING_SIMULATION_VERIFICATION_ENDPOINT: http://host.docker.internal:8081/verification
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  web:
    build:
      context: frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:80"
volumes:
  postgres-data:
