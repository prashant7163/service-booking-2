services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: service_booking_two
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d service_booking_two"]
      interval: 2s
      timeout: 5s
      retries: 30
  api:
    build:
      context: backend
      target: development
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/service_booking_two
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDEMPTION_HMAC_SECRET: ${REDEMPTION_HMAC_SECRET:?Set REDEMPTION_HMAC_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  postgres-data:
